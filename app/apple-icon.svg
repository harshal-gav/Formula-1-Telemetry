<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141C"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="50%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2BE"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Rect -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#27272A" stroke-width="2"/>

  <!-- Subtle grid lines -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="#1F2433" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1F2433" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="8" y1="44" x2="56" y2="44" stroke="#1F2433" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="24" y1="10" x2="24" y2="54" stroke="#1F2433" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="40" y1="10" x2="40" y2="54" stroke="#1F2433" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Driver 2 Trace (Cyan subtle comparison line) -->
  <path d="M 8 46 L 16 43 L 23 48 L 29 25 L 36 27 L 44 18 L 56 16"
        fill="none"
        stroke="url(#cyanGrad)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.6"/>

  <!-- Driver 1 Trace (Primary Red Telemetry Curve with Glow) -->
  <path d="M 8 44 L 15 40 L 22 47 L 28 20 L 36 21 L 43 14 L 56 12"
        fill="none"
        stroke="url(#redGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Peak Speed Pulse Dot -->
  <circle cx="43" cy="14" r="3" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="43" cy="14" r="1.5" fill="#E10600"/>

  <!-- Apex Braking Marker -->
  <circle cx="22" cy="47" r="2.5" fill="#FF9500"/>

  <!-- Red Racing Corner Accent -->
  <path d="M 44 2 L 56 2 C 60 2 62 4 62 8 L 62 20 Z" fill="#E10600" opacity="0.85"/>
</svg>
